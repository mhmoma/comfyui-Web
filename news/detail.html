<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资讯详情 · ComfyUI Web</title>
    <link rel="stylesheet" href="/assets/site.css?v=18">
</head>
<body class="page-site">
    <div class="home-nav-bar home-nav-bar-static">
        <header class="home-nav">
            <a href="/" class="home-nav-logo">ComfyUI <span>Web</span></a>
            <nav class="home-nav-links" aria-label="主导航">
                <a href="/news/" class="active">资讯</a>
                <a href="/guides/">教程</a>
                <a href="/app/">生图</a>
                <a href="/card/">角色卡</a>
                <a href="/about/">关于</a>
            </nav>
            <a class="home-nav-cta" href="/app/?arch=anima">开始创作</a>
        </header>
    </div>

    <main class="site-main" id="article-root">
        <p class="empty-state">加载中…</p>
    </main>

    <footer class="home-footer">
        <span>ComfyUI Web</span>
        <span><a href="/news/">← 返回资讯</a></span>
    </footer>

    <script>
    (function () {
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const slug = params.get('slug');
        const root = document.getElementById('article-root');
        const CATEGORY_LABELS = { model: '模型动态', tutorial: '教程技巧', tool: '工具更新', community: '社区精选' };

        function esc(s) {
            return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function renderArticle(a) {
            document.title = a.title + ' · ComfyUI Web';
            const date = new Date(a.published_at).toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
            const tags = (a.tags||[]).map(t => `<span class="article-tag"><a href="/app/?tag=${encodeURIComponent(t)}">#${esc(t)}</a></span>`).join('');
            root.innerHTML = `
                <article>
                    <header class="article-header">
                        <span class="cat-badge cat-${esc(a.category)}">${CATEGORY_LABELS[a.category]||a.category}</span>
                        <h1>${esc(a.title)}</h1>
                        <div class="article-meta"><span>${date}</span></div>
                    </header>
                    ${a.cover_url ? `<img class="article-cover" src="${esc(a.cover_url)}" alt="">` : ''}
                    <div class="article-content">${a.content_html}</div>
                    ${tags ? `<div class="article-tags">${tags}</div>` : ''}
                    <div class="article-actions">
                        <a href="/news/" class="home-btn-dark" style="background:#fff;color:#111 !important;border-color:#111">← 返回资讯</a>
                    </div>
                </article>`;
        }

        if (!id && !slug) {
            root.innerHTML = '<p class="empty-state">缺少文章参数</p>';
            return;
        }

        const apiUrl = id
            ? '/api/articles?id=' + encodeURIComponent(id)
            : '/api/articles/' + encodeURIComponent(slug);

        fetch(apiUrl)
            .then(r => r.json().then(d => ({ ok: r.ok, d })))
            .then(({ ok, d }) => {
                if (!ok || !d.article) {
                    root.innerHTML = '<p class="empty-state">文章不存在或已删除<br><a href="/news/">返回资讯列表</a></p>';
                    return;
                }
                renderArticle(d.article);
            })
            .catch(() => {
                root.innerHTML = '<p class="empty-state">加载失败<br><a href="/news/">返回资讯列表</a></p>';
            });
    })();
    </script>
    <script src="/assets/site.js?v=13"></script>
</body>
</html>
