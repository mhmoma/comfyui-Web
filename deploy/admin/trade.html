<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>画师串交流管理 · ComfyUI Web</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #ebe6dc;
      --card: #f7f3ea;
      --text: #1a1814;
      --muted: #6a635a;
      --line: rgba(26, 24, 20, 0.14);
      --danger: #a61b1b;
      --warn: #8a5a00;
      --accent: #0f5c48;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 92, 72, 0.08), transparent 42%),
        linear-gradient(180deg, #e7e0d2, var(--bg));
      color: var(--text);
    }
    .wrap { width: min(980px, calc(100% - 24px)); margin: 24px auto 48px; }
    h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0.02em; }
    .sub { margin: 0 0 20px; color: var(--muted); line-height: 1.5; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input[type="password"], select {
      flex: 1 1 220px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.danger { background: #fff5f4; border-color: #f0c2bc; color: var(--danger); }
    button.warn { background: #fff8e8; border-color: #e6d2a0; color: var(--warn); }
    button:disabled { opacity: 0.5; cursor: default; }
    .hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
    .err { margin-top: 10px; color: var(--danger); font-size: 13px; }
    .toolbar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 18px 0 12px; }
    .stats { color: var(--muted); font-size: 13px; }
    .list { display: grid; gap: 12px; }
    .item {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }
    @media (max-width: 640px) {
      .item { grid-template-columns: 1fr; }
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #ddd6c8;
    }
    .thumb-empty {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 1;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-size: 13px;
      background: #f0ebe1;
    }
    .thumb-empty.is-blocked { color: var(--warn); background: #fff6df; }
    .item-body { display: grid; gap: 8px; min-width: 0; }
    .item-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .title { margin: 0; font-size: 16px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      font-size: 12px;
      color: var(--muted);
    }
    .badge.blocked { border-color: #e6d2a0; color: var(--warn); background: #fff8e8; }
    .badge.off { opacity: 0.7; }
    .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
    .trigger {
      margin: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: #faf7f0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow: auto;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
    .hidden { display: none !important; }
    a.nav { color: var(--accent); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="row">
        <a class="nav" href="/admin/">← 资讯管理</a>
        <a class="nav" href="/admin/board.html">留言板</a>
      </div>
      <a class="nav" href="https://www.dzmm.ai" target="_blank" rel="noopener">打开游戏站</a>
    </div>
    <h1>画师串交流管理</h1>
    <p class="sub">审核上架内容：可直接删除整条，或「屏蔽图片」清空图数据并打码对外不可见（卖家/买家也看不到）。密钥与 Cloudflare <code>ADMIN_KEY</code> 相同。</p>

    <section id="login" class="card">
      <div class="row">
        <input id="key" type="password" placeholder="管理密钥" autocomplete="current-password">
        <button type="button" id="btn-login" class="primary">登录</button>
      </div>
      <p class="hint">密钥只保存在本机 sessionStorage，不会写入页面代码。</p>
      <p id="login-error" class="err hidden"></p>
    </section>

    <section id="panel" class="hidden">
      <div class="toolbar">
        <div class="stats" id="stats">共 0 条</div>
        <div class="row">
          <select id="status-filter" title="状态筛选">
            <option value="active">在售</option>
            <option value="off">已下架</option>
            <option value="all">全部</option>
          </select>
          <button type="button" id="btn-refresh">刷新</button>
          <button type="button" id="btn-logout">退出</button>
        </div>
      </div>
      <div id="list" class="list"></div>
      <div class="pager">
        <button type="button" id="btn-prev">上一页</button>
        <span id="page-label">1 / 1</span>
        <button type="button" id="btn-next">下一页</button>
      </div>
      <p id="panel-error" class="err hidden"></p>
    </section>
  </div>

  <script>
    const API = "/api/artist-trade";
    const KEY_STORE = "tk_trade_admin_key";
    let page = 1;
    let totalPages = 1;
    let status = "active";

    const $ = (id) => document.getElementById(id);

    function getKey() {
      return sessionStorage.getItem(KEY_STORE) || "";
    }

    function setKey(value) {
      if (value) sessionStorage.setItem(KEY_STORE, value);
      else sessionStorage.removeItem(KEY_STORE);
    }

    function showError(id, message) {
      const el = $(id);
      if (!el) return;
      if (!message) {
        el.classList.add("hidden");
        el.textContent = "";
        return;
      }
      el.textContent = message;
      el.classList.remove("hidden");
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[c]));
    }

    function formatTime(at) {
      const ts = Number(at) || 0;
      if (!ts) return "";
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    async function api(path, opts = {}) {
      const key = getKey();
      const res = await fetch(path, {
        ...opts,
        headers: {
          ...(opts.headers || {}),
          "x-admin-key": key,
          ...(opts.body ? { "Content-Type": "application/json" } : {}),
        },
      });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = new Error(data?.message || `HTTP ${res.status}`);
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    async function load(targetPage = page) {
      showError("panel-error", "");
      status = $("status-filter").value || "active";
      const data = await api(`${API}?view=admin&status=${encodeURIComponent(status)}&page=${targetPage}`);
      page = data.page || 1;
      totalPages = data.totalPages || 1;
      $("stats").textContent = `共 ${data.total || 0} 条 · 第 ${page}/${totalPages} 页`;
      $("page-label").textContent = `${page} / ${totalPages}`;
      $("btn-prev").disabled = page <= 1;
      $("btn-next").disabled = page >= totalPages;

      const rows = Array.isArray(data.rows) ? data.rows : [];
      if (!rows.length) {
        $("list").innerHTML = `<div class="card meta">当前没有上架记录</div>`;
        return;
      }
      $("list").innerHTML = rows.map((row) => {
        const blocked = !!row.imageBlocked;
        const media = row.image
          ? `<img class="thumb" src="${escapeHtml(row.image)}" alt="">`
          : `<div class="thumb-empty${blocked ? " is-blocked" : ""}">${blocked ? "已打码清空" : "无图"}</div>`;
        const badges = [
          row.status === "off" ? `<span class="badge off">已下架</span>` : `<span class="badge">在售</span>`,
          blocked ? `<span class="badge blocked">图片已屏蔽</span>` : "",
        ].filter(Boolean).join(" ");
        return `
        <article class="item" data-id="${escapeHtml(row.id)}">
          ${media}
          <div class="item-body">
            <div class="item-head">
              <h2 class="title">${escapeHtml(row.title || "未命名")}</h2>
              <div>${badges}</div>
            </div>
            <div class="meta">
              卖家 ${escapeHtml(row.sellerName || "访客")}
              · UID ${escapeHtml(row.sellerId || "-")}
              · ${Number(row.price) || 0} 画泥
              · ${escapeHtml(formatTime(row.at))}
              · id ${escapeHtml(row.id)}
            </div>
            <pre class="trigger">${escapeHtml(row.trigger || "")}</pre>
            <div class="actions">
              <button type="button" class="warn btn-block" data-id="${escapeHtml(row.id)}" ${blocked || (!row.image && !row.hasImage) ? "disabled" : ""}>屏蔽图片</button>
              <button type="button" class="danger btn-del" data-id="${escapeHtml(row.id)}">删除整条</button>
            </div>
          </div>
        </article>`;
      }).join("");
    }

    async function login() {
      const key = $("key").value.trim();
      if (!key) {
        showError("login-error", "请输入管理密钥");
        return;
      }
      setKey(key);
      try {
        const res = await fetch(`${API}?id=__admin_auth_check__`, {
          method: "DELETE",
          headers: { "x-admin-key": key },
        });
        if (res.status === 403) throw Object.assign(new Error("密钥错误"), { status: 403 });
        if (!res.ok && res.status !== 404) {
          let data = null;
          try { data = await res.json(); } catch (_) {}
          throw new Error(data?.message || `HTTP ${res.status}`);
        }
        await load(1);
        $("login").classList.add("hidden");
        $("panel").classList.remove("hidden");
        showError("login-error", "");
      } catch (err) {
        setKey("");
        showError("login-error", err.status === 403 ? "密钥错误" : (err.message || "登录失败"));
      }
    }

    async function removeOne(id) {
      if (!id) return;
      if (!confirm("确定删除这条画师串？购买记录与未领取收益也会一并清除。")) return;
      try {
        await api(`${API}?id=${encodeURIComponent(id)}`, { method: "DELETE" });
        await load(page);
      } catch (err) {
        showError("panel-error", err.message || "删除失败");
      }
    }

    async function blockImage(id) {
      if (!id) return;
      if (!confirm("屏蔽后将清空图片数据，市场与卖家/买家均不可见，且无法恢复。确定？")) return;
      try {
        await api(API, {
          method: "POST",
          body: JSON.stringify({ action: "admin_block_image", listingId: id }),
        });
        await load(page);
      } catch (err) {
        showError("panel-error", err.message || "屏蔽失败");
      }
    }

    function logout() {
      setKey("");
      $("panel").classList.add("hidden");
      $("login").classList.remove("hidden");
      $("key").value = "";
    }

    $("btn-login").addEventListener("click", login);
    $("key").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });
    $("btn-refresh").addEventListener("click", () => load(page).catch((err) => showError("panel-error", err.message)));
    $("status-filter").addEventListener("change", () => load(1).catch((err) => showError("panel-error", err.message)));
    $("btn-logout").addEventListener("click", logout);
    $("btn-prev").addEventListener("click", () => load(page - 1).catch((err) => showError("panel-error", err.message)));
    $("btn-next").addEventListener("click", () => load(page + 1).catch((err) => showError("panel-error", err.message)));
    $("list").addEventListener("click", (e) => {
      const del = e.target?.closest?.(".btn-del");
      if (del) return removeOne(del.getAttribute("data-id"));
      const block = e.target?.closest?.(".btn-block");
      if (block) return blockImage(block.getAttribute("data-id"));
    });

    if (getKey()) {
      load(1).then(() => {
        $("login").classList.add("hidden");
        $("panel").classList.remove("hidden");
      }).catch(() => {
        setKey("");
      });
    }
  </script>
</body>
</html>
