<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>绘画大师运营台 · ComfyUI Web</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/tk-admin.css?v=18">
</head>
<body>
  <section id="login" class="login-wrap">
    <div class="login-card">
      <h1>绘画大师运营台</h1>
      <p class="admin-ver" data-admin-ver>运营台 v—</p>
      <p>用户管理用中文按钮：加钱、删装扮、解锁、按人隐藏作品。云端库 + 素材站。</p>
      <div class="login-row">
        <input id="admin-key" type="password" placeholder="ADMIN_KEY" autocomplete="current-password">
        <button type="button" class="primary" id="btn-login">进入后台</button>
      </div>
      <p id="login-error" class="err hidden"></p>
      <p class="hint">与 Cloudflare 环境变量 <code>ADMIN_KEY</code> 相同（正式站与 tk-game-cloud 都要配置）。不要把密钥写进仓库。</p>
    </div>
  </section>

  <div id="app" class="shell hidden">
    <aside class="sidebar">
      <div class="brand">
        <strong>运营台</strong>
        <span class="admin-ver" data-admin-ver>运营台 v—</span>
        <span>概览 · 人 · 钱 · 社区 · 素材</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button type="button" id="btn-reload">刷新当前模块</button>
        <button type="button" id="btn-logout">退出登录</button>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div>
          <h2 id="view-title">总览</h2>
          <p class="sub" id="view-sub"></p>
        </div>
        <div class="topbar-right">
          <span class="admin-ver-badge" data-admin-ver>运营台 v—</span>
          <a class="meta" href="/" target="_blank" rel="noopener">打开站点</a>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <script src="/assets/tk-admin.js?v=37"></script>
</body>
</html>
